{#- 헤더 우측 로그인/프로필. 서버가 로그인 상태로 바로 그려서, 페이지 이동 때
    '로그인' 버튼이 잠깐 보였다가 프로필로 바뀌는 깜빡임을 없앤다.
    각 페이지 JS 가 /api/me 를 받은 뒤 같은 모양으로 다시 그린다. -#}
<div id="authArea" class="auth-area">
  {%- if current_user.is_authenticated %}
  <div class="profile-area">
    {%- if current_user.profile_image %}
    <img class="profile-img" src="{{ current_user.profile_image }}" alt="" style="width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--border);flex-shrink:0;" />
    {%- else %}
    <div class="profile-img" style="width:28px;height:28px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:14px">👤</div>
    {%- endif %}
    <span class="profile-name">{{ current_user.name or '사용자' }}</span>
  </div>
  <a href="/auth/logout" class="logout-btn">로그아웃</a>
  {%- else %}
  <button class="login-btn" onclick="{{ login_action }}">로그인</button>
  {%- endif %}
</div>
